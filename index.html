<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이력서 - 오준혁</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="name"></h1>
            <p id="intro"></p>
        </header>

        <main>
            <!-- EXPERIENCE 섹션 -->
            <section class="section">
                <h2>EXPERIENCE</h2>
                <div id="experience-container"></div>
            </section>

            <!-- SKILLS 섹션 -->
            <section class="section">
                <h2>SKILLS</h2>
                <div class="skills-table">
                    <table id="skills-table"></table>
                </div>
            </section>

            <!-- PROJECTS 섹션 -->
            <section class="section">
                <h2>PROJECTS</h2>
                <div id="projects-container"></div>
            </section>

            <!-- CERTIFICATIONS 섹션 -->
            <section class="section">
                <h2>CERTIFICATIONS</h2>
                <ul class="certification-list" id="certifications-list"></ul>
            </section>

            <!-- EDUCATION 섹션 -->
            <section class="section">
                <h2>EDUCATION</h2>
                <ul class="education-list" id="education-list"></ul>
            </section>
        </main>

        <aside>
            <section class="contact-info">
                <h2>CONTACT</h2>
                <p><i class="fas fa-phone"></i><span id="phone"></span></p>
                <p><i class="fas fa-envelope"></i><span id="email"></span></p>
                <p><i id="website-icon" class="fab fa-linkedin"></i><a id="website" href="#">Link</a></p>
            </section>
        </aside>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> - 오준혁</p>
    </footer>

    <!-- 공통 기능이 포함된 utils.js 먼저 로드 -->
    <script src="js/utils.js"></script>
    <!-- 동적 로딩을 위한 main.js 로드 -->
    <script src="js/main.js"></script>
</body>
</html>
