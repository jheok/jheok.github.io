<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이력서</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="name">이름</h1>
            <p id="intro">자기소개</p>
        </header>

        <main>
            <!-- EXPERIENCE 섹션 - JavaScript에서 동적 생성 -->
            <section class="section">
                <h2>EXPERIENCE</h2>
                <!-- JavaScript로 동적 생성됨 -->
            </section>

            <!-- SKILLS 섹션 -->
            <section class="section">
                <h2>SKILLS</h2>
                <div class="skills-table">
                    <table>
                        <!-- JavaScript로 동적 생성됨 -->
                    </table>
                </div>
            </section>

            <!-- PROJECTS 섹션 - JavaScript에서 동적 생성 -->
            <section class="section">
                <h2>PROJECTS</h2>
                <!-- JavaScript로 동적 생성됨 -->
            </section>

            <!-- CERTIFICATIONS 섹션 -->
            <section class="section">
                <h2>CERTIFICATIONS</h2>
                <ul class="certification-list">
                    <!-- JavaScript로 동적 생성됨 -->
                </ul>
            </section>

            <!-- EDUCATION 섹션 -->
            <section class="section">
                <h2>EDUCATION</h2>
                <ul class="education-list">
                    <!-- JavaScript로 동적 생성됨 -->
                </ul>
            </section>
        </main>

        <aside>
            <section class="contact-info">
                <h2>CONTACT</h2>
                <p><i class="fas fa-phone"></i> Phone: <span id="phone">-</span></p>
                <p><i class="fas fa-envelope"></i> Email: <span id="email">-</span></p>
                <p><i class="fas fa-globe"></i> Website: <span id="website">-</span></p>
            </section>
        </aside>
    </div>

    <footer>
        <p>&copy; <span id="current-year">2023</span> - 이력서</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
